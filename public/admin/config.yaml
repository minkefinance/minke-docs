backend:
  name: github
  repo: /minkefinance/minke-docs # 必须匹配你的GitHub项目
  branch: main
  base_url: https://workers.dev # 第三步生成的Worker网关地址
  auth_endpoint: /auth

media_folder: "static/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "docs"
    label: "说明文档 (Docs)"
    folder: "src/docs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "唯一标识 (ID)", name: "id", widget: "string" }
      - { label: "标题 (Title)", name: "title", widget: "string" }
      - { label: "侧边栏排序 (Sidebar Position)", name: "sidebar_position", widget: "number", required: false }
      - { label: "正文内容 (Body)", name: "body", widget: "markdown" }
